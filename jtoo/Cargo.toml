[package]
authors = ["Michael Leonhard <michael@leonhardllc.com>"]
categories = ["network-programming"]
description = "Rust library for serializing and deserializing the JTOO data format"
edition = "2021"
keywords = ["jtoo", "htoo", "json"]
license = "MIT OR Apache-2.0"
name = "jtoo"
repository = "https://github.com/mleonhard/jtoo-rs"
version = "0.1.0"

[dependencies]
# TODO: Remove transitive dependency on unsafe `arrayvec` crate.
jtoo_derive = { version = "0.1", path = "../jtoo_derive" }
rust_decimal = { version = "1", default-features = false, optional = true }
time = { version = "0.3", default-features = false, optional = true }

[dev-dependencies]
rust_decimal = { version = "1", default-features = false }
rust_decimal_macros = { version = "1", default-features = false }
time = { version = "0.3", default-features = false }
